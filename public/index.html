<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Week 4 API — Live</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #09090b;
      background-image: radial-gradient(circle at center, #2a0808 0%, #09090b 75%);
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }

    .card {
      background-color: #111114;
      border: 3px solid #dc2626;
      border-radius: 16px;
      padding: 3.5rem 3.5rem;
      text-align: center;
      box-shadow: 0 0 40px rgba(220, 38, 38, 0.35);
      max-width: 820px;
      width: 100%;
    }

    .badge {
      display: inline-block;
      background-color: #dc2626;
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 0.45rem 1.2rem;
      border-radius: 999px;
      margin-bottom: 1.5rem;
    }

    h1 {
      font-size: clamp(2.8rem, 6.5vw, 4.8rem);
      font-weight: 900;
      line-height: 1.08;
      letter-spacing: -0.02em;
      color: #ffffff;
      text-shadow: 0 4px 24px rgba(239, 68, 68, 0.6);
      margin-bottom: 1.25rem;
    }

    h1 span {
      color: #ef4444;
    }

    p {
      font-size: 1.3rem;
      color: #d4d4d8;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    code {
      color: #fca5a5;
      background-color: #18181b;
      padding: 0.15rem 0.45rem;
      border-radius: 5px;
    }

    .endpoints {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.85rem;
    }

    .pill {
      background-color: #18181b;
      border: 1.5px solid #991b1b;
      color: #fca5a5;
      font-family: Consolas, Monaco, monospace;
      font-size: 1.05rem;
      font-weight: 700;
      padding: 0.6rem 1.1rem;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Live on Render  •  Express.js</div>
    <h1>My <span>Week 4</span> API!</h1>
    <p>Static landing page served from <code>/public</code>. Append <code>/todos</code> (or your API route) to test endpoints.</p>
    <div class="endpoints">
      <div class="pill">GET /</div>
      <div class="pill">GET /todos</div>
      <div class="pill">POST /todos</div>
      <div class="pill">PUT /todos/:id</div>
      <div class="pill">DELETE /todos/:id</div>
    </div>
  </div>
</body>
</html>
